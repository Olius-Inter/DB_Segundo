sonar.projectKey=Olius-Inter_DB_Segundo
sonar.organization=olius-inter

# Código principal
sonar.sources=PostgreSQL

# Código de testes
sonar.tests=PostgreSQL/tests

# Evita que os testes também sejam classificados como código principal
sonar.exclusions=PostgreSQL/tests/**

# A carga documental contém dados repetitivos, não blocos de lógica duplicados.
sonar.cpd.exclusions=PostgreSQL/data_catalog/04_load.sql

# O analisador PL/SQL interpreta incorretamente comparações IS NULL válidas no PostgreSQL.
sonar.issue.ignore.multicriteria=catalogNullComparison
sonar.issue.ignore.multicriteria.catalogNullComparison.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.catalogNullComparison.resourceKey=PostgreSQL/data_catalog/02_check_constraints.sql

# Contadores reais de instruções PL/pgSQL, convertidos pelo runner do CI.
sonar.coverageReportPaths=coverage/postgresql.xml

# Encoding
sonar.sourceEncoding=UTF-8
