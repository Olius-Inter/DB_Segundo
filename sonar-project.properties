sonar.projectKey=Olius-Inter_DB_Segundo
sonar.organization=olius-inter

# Código principal (Databricks pode ser adicionado sem alterar esta configuração).
sonar.sources=.
sonar.inclusions=PostgreSQL/**,Databricks/**

# Código de testes (os filtros permitem diretórios ainda não adicionados).
sonar.tests=.
sonar.test.inclusions=PostgreSQL/tests/**,PostgreSQL/data_load/test_*.py,Databricks/tests/**

# Evita que os testes também sejam classificados como código principal
sonar.exclusions=PostgreSQL/tests/**,PostgreSQL/data_load/test_*.py,Databricks/tests/**

# A carga documental contém dados repetitivos, não blocos de lógica duplicados.
# A migração espelha definições canônicas; igualdade é verificada pelo teste.
sonar.cpd.exclusions=PostgreSQL/data_catalog/04_load.sql,PostgreSQL/migrations/20261029_failed_collection_visit.sql,PostgreSQL/migrations/20261030_collection_revision_history.sql

# O analisador PL/SQL interpreta incorretamente comparações IS NULL válidas no PostgreSQL.
sonar.issue.ignore.multicriteria=catalogNullComparison
sonar.issue.ignore.multicriteria.catalogNullComparison.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.catalogNullComparison.resourceKey=PostgreSQL/data_catalog/02_check_constraints.sql

# Contadores reais de instruções PL/pgSQL, convertidos pelo runner do CI.
sonar.coverageReportPaths=coverage/postgresql.xml
sonar.python.coverage.reportPaths=coverage/data-load-python.xml,coverage/databricks-python.xml,coverage/backup-recovery/python.xml

# Encoding
sonar.sourceEncoding=UTF-8
