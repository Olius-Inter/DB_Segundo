name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-validation:
    name: Validate PostgreSQL and Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: olius_test
      OLIUS_CI_DISPOSABLE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Preparar PostgreSQL com medição de cobertura
        run: |
          docker build -t olius-postgres-coverage -f PostgreSQL/tests/Dockerfile.coverage .
          docker run -d --name olius-ci-db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="$PGPASSWORD" -e POSTGRES_DB="$PGDATABASE" olius-postgres-coverage
          for attempt in $(seq 1 60); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              exit 0
            fi
            sleep 1
          done
          docker logs olius-ci-db
          exit 1

      - name: Validar conversão do relatório de cobertura
        run: python3 -m unittest discover -s PostgreSQL/tests -p 'test_export_coverage.py' -v

      - name: Instalar scripts, executar regressões e concorrência e gerar cobertura
        run: python3 PostgreSQL/tests/run_ci.py

      - name: Publicar relatório e logs dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-tests-and-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Remover banco descartável
        if: always()
        run: docker rm -f -v olius-ci-db
