name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  database-validation:
    name: Validate PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olius_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Executar estrutura do banco
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d olius_test \
            -v ON_ERROR_STOP=1 \
            -f PostgreSQL/01_structure.sql

      - name: Executar constraints
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d olius_test \
            -v ON_ERROR_STOP=1 \
            -f PostgreSQL/02_check_constraints.sql

      - name: Executar índices
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d olius_test \
            -v ON_ERROR_STOP=1 \
            -f PostgreSQL/03_indexes.sql