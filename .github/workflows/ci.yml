name: CI

on:
  pull_request:
    branches: [main, feat/central-notificacoes]
  push:
    branches: ['**']

permissions:
  contents: read

# Serializa execuções da mesma PR/ref sem interromper análises já enviadas ao Sonar.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  database-validation:
    name: Validate PostgreSQL and Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: olius_test
      OLIUS_CI_DISPOSABLE: '1'
      OLIUS_TEST_DOCKER_CONTAINER: olius-ci-db

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Preparar PostgreSQL com medição de cobertura
        run: |
          docker build -t olius-postgres-coverage -f PostgreSQL/tests/Dockerfile.coverage .
          docker run -d --name olius-ci-db -p 127.0.0.1:5432:5432 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e POSTGRES_PASSWORD="$PGPASSWORD" -e POSTGRES_DB="$PGDATABASE" olius-postgres-coverage
          for attempt in $(seq 1 60); do
            if docker exec -e PGPASSWORD="$PGPASSWORD" olius-ci-db psql -h 127.0.0.1 -U "$PGUSER" -d "$PGDATABASE" -X -v ON_ERROR_STOP=1 -qAt -c 'SELECT 1;' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs olius-ci-db
          exit 1

      - name: Validar conversão do relatório de cobertura
        run: python3 -m unittest discover -s PostgreSQL/tests -p 'test_export_coverage.py' -v

      - name: Instalar scripts, executar regressões e concorrência e gerar cobertura
        run: python3 PostgreSQL/tests/run_ci.py

      - name: Testar runner do Data Load e gerar cobertura Python
        env:
          COVERAGE_FILE: coverage/.coverage-data-load
        run: |
          python3 -m venv "$RUNNER_TEMP/olius-data-load-venv"
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m pip install coverage==7.10.7
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m coverage run --source=PostgreSQL/data_load --omit='*/test_runner.py' -m unittest discover -s PostgreSQL/data_load -p 'test_runner.py' -v
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m coverage report --fail-under=80
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m coverage xml -o coverage/data-load-python.xml

      - name: Testar ETL legado com carga descartável e cobertura Python
        if: ${{ hashFiles('PostgreSQL/legacy_rpa_etl/pipeline.py') != '' }}
        env:
          COVERAGE_FILE: coverage/.coverage-legacy-etl
          OLIUS_ETL_DISPOSABLE: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/olius-legacy-etl-venv"
          "$RUNNER_TEMP/olius-legacy-etl-venv/bin/python" -m pip install coverage==7.10.7 -r PostgreSQL/legacy_rpa_etl/requirements.txt
          "$RUNNER_TEMP/olius-legacy-etl-venv/bin/python" -m coverage run --rcfile=PostgreSQL/legacy_rpa_etl/.coveragerc -m unittest discover -s PostgreSQL/legacy_rpa_etl -p 'test_*.py' -v
          "$RUNNER_TEMP/olius-legacy-etl-venv/bin/python" -m coverage run --append --rcfile=PostgreSQL/legacy_rpa_etl/.coveragerc PostgreSQL/legacy_rpa_etl/integration_check.py
          "$RUNNER_TEMP/olius-legacy-etl-venv/bin/python" -m coverage report --rcfile=PostgreSQL/legacy_rpa_etl/.coveragerc --fail-under=80
          "$RUNNER_TEMP/olius-legacy-etl-venv/bin/python" -m coverage xml --rcfile=PostgreSQL/legacy_rpa_etl/.coveragerc -o coverage/legacy-etl-python.xml

      - name: Validar DAG Airflow isolada e gerar cobertura Python
        if: ${{ hashFiles('PostgreSQL/legacy_rpa_etl/airflow/Dockerfile') != '' }}
        run: |
          docker build --target validation -t olius-legacy-airflow-validation -f PostgreSQL/legacy_rpa_etl/airflow/Dockerfile PostgreSQL/legacy_rpa_etl
          install -d -m 0770 coverage/legacy-airflow
          docker run --rm --network none --group-add "$(id -g)" --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/coverage/legacy-airflow:/workspace/coverage/legacy-airflow" \
            -w /workspace -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e PYTHONPATH=/workspace/PostgreSQL/legacy_rpa_etl \
            -e OLIUS_DAG_FOLDER=/workspace/PostgreSQL/legacy_rpa_etl/airflow/dags \
            -e COVERAGE_FILE=/workspace/coverage/legacy-airflow/.coverage \
            olius-legacy-airflow-validation -euc '
              python -m coverage run --rcfile=PostgreSQL/legacy_rpa_etl/airflow/.coveragerc -m unittest discover -s PostgreSQL/legacy_rpa_etl/airflow/tests -p "test_*.py" -v
              python -m coverage report --rcfile=PostgreSQL/legacy_rpa_etl/airflow/.coveragerc --fail-under=80
              python -m coverage xml --rcfile=PostgreSQL/legacy_rpa_etl/airflow/.coveragerc -o coverage/legacy-airflow/python.xml
            '

      - name: Testar refresh Databricks e gerar cobertura Python
        if: ${{ hashFiles('Databricks/**') != '' }}
        env:
          COVERAGE_FILE: coverage/.coverage-databricks
        run: |
          test -f Databricks/01_refresh.py
          test -f Databricks/tests/test_refresh.py
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -c "import unittest; suite = unittest.TestLoader().discover('Databricks/tests', pattern='test_*.py'); assert suite.countTestCases() > 0, 'Nenhum teste Databricks encontrado'"
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m coverage run --source=Databricks --omit='*/tests/*' -m unittest discover -s Databricks/tests -p 'test_*.py' -v
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m coverage report --fail-under=80
          "$RUNNER_TEMP/olius-data-load-venv/bin/python" -m coverage xml -o coverage/databricks-python.xml

      - name: Validar recuperação completa e gerar cobertura Python
        run: |
          docker build -t olius-backup-validation -f PostgreSQL/backup_recovery/Dockerfile.validation .
          install -d -m 0770 coverage/backup-recovery
          docker run --rm --network none --group-add "$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/coverage/backup-recovery:/workspace/coverage/backup-recovery" \
            -e COVERAGE_FILE=/workspace/coverage/backup-recovery/.coverage \
            olius-backup-validation bash -euc '
              python -m coverage run --rcfile=PostgreSQL/backup_recovery/.coveragerc -m unittest discover -s PostgreSQL/tests -p test_backup_recovery.py -v
              python -m coverage run --append --rcfile=PostgreSQL/backup_recovery/.coveragerc PostgreSQL/backup_recovery/validate_recovery.py --pg-bin /usr/lib/postgresql/16/bin --ci-reports
              python -m coverage report --rcfile=PostgreSQL/backup_recovery/.coveragerc
              python -m coverage xml --rcfile=PostgreSQL/backup_recovery/.coveragerc -o coverage/backup-recovery/python.xml
            '

      - name: Validar carga completa em outro banco descartável
        env:
          OLIUS_DATA_LOAD_DISPOSABLE: '1'
        run: |
          docker run -d --name olius-ci-data-load --network none \
            --label org.olius.data_load.disposable=true \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=olius_data_load olius-postgres-coverage
          database_ready=false
          for attempt in $(seq 1 60); do
            if docker exec olius-ci-data-load psql -h 127.0.0.1 -U postgres -d olius_data_load -X -v ON_ERROR_STOP=1 -qAt -c 'SELECT 1;' > /dev/null 2>&1; then
              database_ready=true
              break
            fi
            sleep 1
          done
          if [ "$database_ready" != true ]; then
            docker logs olius-ci-data-load
            exit 1
          fi
          python3 PostgreSQL/data_load/run.py --container olius-ci-data-load --install --install-access-control --report-dir coverage/data-load

      - name: Publicar relatório e logs dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgresql-tests-and-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: SonarQube Scan
        # A organização permite análise de PRs e main, mas não de outras branches.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Remover banco descartável
        if: always()
        run: |
          docker rm -f -v olius-ci-db
          if docker container inspect olius-ci-data-load > /dev/null 2>&1; then
            docker rm -f -v olius-ci-data-load
          fi

  legacy-scheduler-validation:
    name: Validate legacy ETL scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Preparar dependências isoladas
        run: |
          python3 -m venv "$RUNNER_TEMP/olius-scheduler-venv"
          "$RUNNER_TEMP/olius-scheduler-venv/bin/python" -m pip install -r PostgreSQL/legacy_rpa_etl/requirements.txt
          docker build --target validation -t olius-legacy-airflow:validation -f PostgreSQL/legacy_rpa_etl/airflow/Dockerfile PostgreSQL/legacy_rpa_etl
      - name: Executar DAG real com origem e destino fictícios em rede interna
        env:
          OLIUS_ETL_DISPOSABLE: '1'
        run: |
          "$RUNNER_TEMP/olius-scheduler-venv/bin/python" PostgreSQL/legacy_rpa_etl/airflow/tests/scheduler_check.py --repo "$GITHUB_WORKSPACE" --report coverage/scheduler-validation/report.json
      - name: Publicar evidências agregadas do scheduler
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-scheduler-validation
          path: coverage/scheduler-validation/report.json
          if-no-files-found: warn
          retention-days: 14
