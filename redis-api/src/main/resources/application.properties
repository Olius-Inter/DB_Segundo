spring.application.name=olius-redis-api

# Local runs read .env; real environment variables always win.
spring.config.import=optional:file:.env[.properties]

# Hosting platforms set PORT; the Core uses 8080 locally.
server.port=${PORT:8081}

# Redis: Upstash over TCP/TLS in production, local container in development.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

olius.allowed-origins=${OLIUS_ALLOWED_ORIGINS:}
olius.seed=${OLIUS_SEED:false}
olius.seed-clear=${OLIUS_SEED_CLEAR:false}

# Rebuild source: public.vw_annual_scores, read with this API's own read-only account.
olius.database-url=${OLIUS_DATABASE_URL:}
olius.database-user=${OLIUS_DATABASE_USER:}
olius.database-password=${OLIUS_DATABASE_PASSWORD:}
olius.rebuild-enabled=${OLIUS_REBUILD_ENABLED:true}
olius.rebuild-interval=${OLIUS_REBUILD_INTERVAL:5m}

# Core URL used to validate the app Bearer token (GET /api/v1/auth/session).
olius.core-base-url=${OLIUS_CORE_BASE_URL:}

# X-Service-Token for POST /api/ranking/rebuild; empty rejects every write.
olius.service-token=${OLIUS_SERVICE_TOKEN:}

# Swagger is private by default.
springdoc.api-docs.enabled=${OLIUS_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${OLIUS_API_DOCS_ENABLED:false}
