language: "pt-BR"

reviews:
  profile: "assertive"

  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "PostgreSQL/**/*.sql"
      instructions: |
        Revise qualquer script SQL considerando boas práticas de PostgreSQL,
        modelagem relacional, integridade dos dados, segurança, desempenho
        e manutenibilidade.

        Analise a alteração de acordo com o tipo de objeto SQL encontrado,
        incluindo tabelas, colunas, constraints, índices, funções,
        procedures, window functions, triggers, views e outros objetos
        PostgreSQL adicionados futuramente ao projeto.

        Verifique especialmente:
        - sintaxe e compatibilidade com PostgreSQL;
        - tipos de dados e valores padrão;
        - chaves primárias e estrangeiras;
        - integridade referencial;
        - constraints e regras de domínio;
        - comportamento de ON DELETE e ON UPDATE;
        - índices redundantes, ausentes ou inadequados;
        - impacto de índices sobre operações de escrita;
        - funções e procedures quanto a parâmetros, retornos e efeitos colaterais;
        - triggers quanto a condições, recursão e efeitos inesperados;
        - consultas quanto a joins, filtros e operações potencialmente custosas;
        - dependências entre objetos do banco;
        - ordem de criação dos objetos;
        - possíveis problemas de concorrência e consistência;
        - exposição ou armazenamento inadequado de informações sensíveis.

        Identifique explicitamente operações potencialmente destrutivas,
        como DROP, TRUNCATE, DELETE sem filtro e alterações de estrutura
        que possam provocar perda ou incompatibilidade de dados.

        Considere o contexto dos demais scripts do banco quando uma alteração
        depender de objetos definidos em outros arquivos.

        Evite sugerir otimizações sem benefício claro ou índices sem
        justificativa relacionada ao padrão esperado de acesso aos dados.

    - path: "Databricks/**"
      instructions: |
        Revise scripts, notebooks e configurações considerando o ambiente
        Databricks, Apache Spark, PySpark, Spark SQL e Delta Lake, conforme
        as tecnologias utilizadas em cada arquivo.

        Verifique sintaxe, schemas, tipos de dados, tratamento de valores nulos,
        integridade dos dados e dependências entre etapas de processamento.
        Avalie idempotência das cargas, uso de MERGE, particionamento, joins,
        shuffles e operações que tragam grandes volumes ao driver.

        Identifique operações destrutivas, sobrescritas de tabelas, exposição
        de credenciais e caminhos ou configurações específicos de ambiente.
        Considere a compatibilidade com PostgreSQL quando houver integração
        entre as duas tecnologias e a consistência da documentação.

        No 01_refresh.py, considere o fluxo real: o notebook solicita refresh
        do Data Mart no PostgreSQL via psycopg; dashboards usam o catálogo
        federado. Não presuma ingestão Spark ou cópia para Delta Lake.
        Verifique secrets Unity Catalog, TLS verify-full e validação do PEM,
        isolamento REPEATABLE READ, rollback e falhas durante COMMIT,
        confirmação do snapshot somente após commit, coordenação com o
        advisory lock do PostgreSQL e ausência de retries ocultos.
        Os testes devem funcionar com mocks, sem acesso ao Aiven ou secrets.

    - path: "PostgreSQL/documents/**"
      instructions: |
        Revise a documentação e seus recursos auxiliares considerando
        consistência com a estrutura atual do banco.

        Verifique se exemplos, nomes de tabelas, campos, relacionamentos,
        funções, triggers e demais objetos documentados continuam
        compatíveis com os scripts SQL.

        Para HTML, JavaScript e CSS, identifique também erros relevantes,
        problemas de manutenção e possíveis riscos de segurança.

    - path: ".github/workflows/**"
      instructions: |
        Revise alterações no CI considerando a execução correta dos scripts
        PostgreSQL, a inclusão de Databricks na análise estática e a
        capacidade do workflow de detectar falhas.

        Verifique permissões mínimas, exposição de secrets ou credenciais,
        Actions fixadas por SHA, segurança da cadeia de dependências
        e consistência da ordem de execução dos scripts.

    - path: "sonar-project.properties"
      instructions: |
        Verifique se alterações na configuração do SonarQube continuam
        compatíveis com a estrutura do repositório e não excluem
        inadvertidamente arquivos relevantes da análise.

chat:
  auto_reply: true
